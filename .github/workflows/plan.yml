# Runs on every pull request that touches infrastructure.
#
# Read-only: it says what WOULD change, and changes nothing. The plan
# output is what a reviewer actually reviews -- a one-line edit to a
# variable can read as trivial in the diff and appear as "3 to destroy"
# in the plan.

name: Terraform plan

# No path filter. This check is marked Required by the ruleset on main, and a
# required check that never reports leaves a pull request stuck on
# "Expected -- waiting for status". Running it on every pull request costs
# about thirty seconds and guarantees a result is always published.
on:
  pull_request:

permissions:
  id-token: write    # mint the OIDC token
  contents: read     # let actions/checkout read the repo

# Pinned, not `latest`. The runner image changing underneath the project
# would break the reproducibility this work claims.
jobs:
  plan:
    runs-on: ubuntu-24.04

    defaults:
      run:
        working-directory: infra/envs/lab
        shell: bash

    # The azurerm provider reads these directly. ARM_USE_OIDC is what makes
    # it exchange the GitHub token rather than look for a stored secret;
    # it is set here, not in backend.tf, so the same files still work
    # locally against `az login`.
    env:
      ARM_CLIENT_ID:       ${{ vars.AZURE_CLIENT_ID }}
      ARM_TENANT_ID:       ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      ARM_USE_OIDC:        true
      TF_VAR_admin_ssh_public_key: ${{ vars.LAB_SSH_PUBLIC_KEY }}
      CONFTEST_VERSION: 0.71.1
      CONFTEST_SHA256: c3f6b2a753bd56e377a1e51a95ae3e057f926f2e9139f7d5b5dfbbaf810f7985

    steps:
      # The runner starts empty. Nothing from the repo exists until this.
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.0
          # The wrapper intercepts stdout to expose it as step outputs,
          # which mangles the plan text. Off.
          terraform_wrapper: false

      # Formatting first: it needs no credentials, so a badly formatted
      # file fails in seconds instead of after a cloud round trip.
      - name: Check formatting
        run: terraform fmt -check -recursive

      - uses: azure/login@v2
        with:
          client-id:       ${{ vars.AZURE_CLIENT_ID }}
          tenant-id:       ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Init
        run: terraform init -input=false

      # Checks the configuration is internally coherent. Catches typos in
      # attribute names that a plan would otherwise surface more obscurely.
      - name: Validate
        run: terraform validate

      - name: Plan
        id: plan
        run: terraform plan -input=false -no-color -out=tfplan | tee plan.txt

      - name: Install conftest
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          cd "$RUNNER_TEMP"
          curl -sSfL -O "https://github.com/open-policy-agent/conftest/releases/download/v${CONFTEST_VERSION}/conftest_${CONFTEST_VERSION}_Linux_x86_64.tar.gz"
          sha256sum -c <<< "${CONFTEST_SHA256}  conftest_${CONFTEST_VERSION}_Linux_x86_64.tar.gz"
          tar -xzf "conftest_${CONFTEST_VERSION}_Linux_x86_64.tar.gz" -C "$RUNNER_TEMP/bin" conftest
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/bin/conftest" --version

      # The JSON plan carries sensitive values in plain text. It is written
      # to the runner's temp directory, outside the checkout, and is never
      # uploaded; it is gone when the job ends.
      - name: Policy test against the plan
        run: |
          terraform show -json "tfplan" > "$RUNNER_TEMP/plan.json"
          conftest test --no-color --policy ../../policy "$RUNNER_TEMP/plan.json" --all-namespaces | tee "$RUNNER_TEMP/conftest.txt"

      # Render the plan on the run summary page, one click from the PR's
      # checks, so reviewing does not mean scrolling raw logs.
      - name: Publish plan to job summary
        if: always()
        run: |
          {
            echo '## Terraform plan'
            echo '```'
            tail -c 60000 plan.txt || echo '(no plan output)'
            echo '```'
            echo ''
            echo '## Policy tests'
            echo '```'
            cat "$RUNNER_TEMP/conftest.txt" 2>/dev/null || echo '(no policy test output)'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  plan-observability:
    runs-on: ubuntu-24.04

    defaults:
      run:
        working-directory: infra/envs/observability
        shell: bash

    # The azurerm provider reads these directly. ARM_USE_OIDC is what makes
    # it exchange the GitHub token rather than look for a stored secret;
    # it is set here, not in backend.tf, so the same files still work
    # locally against `az login`.
    env:
      ARM_CLIENT_ID:       ${{ vars.AZURE_CLIENT_ID }}
      ARM_TENANT_ID:       ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      ARM_USE_OIDC:        true

    steps:
      # The runner starts empty. Nothing from the repo exists until this.
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.0
          # The wrapper intercepts stdout to expose it as step outputs,
          # which mangles the plan text. Off.
          terraform_wrapper: false

      # Formatting first: it needs no credentials, so a badly formatted
      # file fails in seconds instead of after a cloud round trip.
      - name: Check formatting
        run: terraform fmt -check -recursive

      - uses: azure/login@v2
        with:
          client-id:       ${{ vars.AZURE_CLIENT_ID }}
          tenant-id:       ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Init
        run: terraform init -input=false

      # Checks the configuration is internally coherent. Catches typos in
      # attribute names that a plan would otherwise surface more obscurely.
      - name: Validate
        run: terraform validate

      - name: Plan
        id: plan
        run: terraform plan -input=false -no-color -out=tfplan | tee plan.txt

      # Render the plan on the run summary page, one click from the PR's
      # checks, so reviewing does not mean scrolling raw logs.
      - name: Publish plan to job summary
        if: always()
        run: |
          {
            echo '## Terraform plan'
            echo '```'
            tail -c 60000 plan.txt || echo '(no plan output)'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
